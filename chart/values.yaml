replicaCount: 2

image:
  # Replace with your ECR repository, e.g.
  # 123456789012.dkr.ecr.us-east-1.amazonaws.com/parcel-tracker
  repository: 501294308535.dkr.ecr.us-east-1.amazonaws.com/parcel-tracker
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Size of the in-memory route cache the app allocates at startup.
cacheMB: 192

# The container warms a cacheMB (192 MiB) in-memory route cache at startup, so
# the memory limit must exceed that plus runtime overhead. At 64Mi the process
# was OOMKilled during cache warmup and never reached Ready. 256Mi leaves
# headroom above the 192 MiB cache.
#
# Keep the limits block: the policy gate rejects workloads without one.
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Startup probe rather than readiness alone: cache warmup legitimately takes a
# few seconds, and we do not want the demo's failure mode confused with a
# probe that is simply too impatient.
startupProbe:
  failureThreshold: 30
  periodSeconds: 2

nodeSelector: {}
tolerations: []
affinity: {}
