replicaCount: 2

image:
  # Replace with your ECR repository, e.g.
  # 123456789012.dkr.ecr.us-east-1.amazonaws.com/parcel-tracker
  repository: 501294308535.dkr.ecr.us-east-1.amazonaws.com/parcel-tracker
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Size of the in-memory route cache the app allocates at startup.
cacheMB: 192

# Memory is sized against the in-memory route cache above (cacheMB: 192).
# The app allocates the full cache during startup, so the container needs
# headroom above 192 MiB or it is OOMKilled before the startup probe ever
# passes. Keep requests at the steady-state cache size and the limit above it;
# if cacheMB changes, change these together.
#
# Do NOT delete the limits block -- the policy gate rejects workloads without
# one.
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Startup probe rather than readiness alone: cache warmup legitimately takes a
# few seconds, and we do not want the demo's failure mode confused with a
# probe that is simply too impatient.
startupProbe:
  failureThreshold: 30
  periodSeconds: 2

nodeSelector: {}
tolerations: []
affinity: {}
