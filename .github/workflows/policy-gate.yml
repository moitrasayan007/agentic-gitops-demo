name: policy-gate

# The gate. Every pull request -- human or agent -- renders the chart and runs
# it through the same Kyverno policies the cluster enforces at admission. A PR
# that would be rejected by the cluster is rejected here instead, with the
# failure written back as a comment the agent can read and act on.

on:
  pull_request:
    paths:
      - "chart/**"
      - "policy/**"
      - "argocd/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: v1.13.2

      - name: Render the chart
        run: |
          mkdir -p rendered
          helm template parcel-tracker chart \
            --namespace parcel-tracker \
            > rendered/manifests.yaml
          echo "--- rendered manifests ---"
          cat rendered/manifests.yaml

      - name: Apply policies
        id: kyverno
        run: |
          set -o pipefail
          kyverno apply policy/ \
            --resource rendered/manifests.yaml \
            --detailed-results \
            2>&1 | tee kyverno-output.txt

      - name: Comment the failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('kyverno-output.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### Policy gate failed',
                '',
                'This change would be rejected by the cluster at admission, so it is',
                'rejected here. The policy output below names the rule and the reason.',
                '',
                '```',
                output,
                '```',
              ].join('\n'),
            });
