name: chart-lint

on:
  pull_request:
    paths:
      - "chart/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint chart

      - name: helm template
        run: helm template parcel-tracker chart --namespace parcel-tracker > /dev/null
